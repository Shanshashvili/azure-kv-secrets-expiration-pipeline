#############################################################################################
## Key Vault Secrets Expiration Check Pipeline for Application Insight
# Description:
#   This pipeline checks all Key Vaults in the Oboba project and identifies secrets
#   that are expiring within 7 days, have already expired, or do not have an expiration date set.
#   Supports both manual and scheduled runs:
#     - Manual run: Single job, environment selected via dropdown.
#     - Scheduled run (09:00 UTC, every weekday): Matrix job for DEV & QA, and separate job for PROD with hardcoded service connections and agent pools.
# Operation:
#   - Scans all Key Vaults in the resource group associated with the selected environment.
#   - Lists all secrets, their expiration dates, and highlights secrets without expiration dates.
#   - Publishes an HTML report artifact per environment if issues are found.
#   - Sends per-environment email alerts via SendGrid (only for environments with findings).
#############################################################################################

### Disable a commit message into the run pipeline name ###
appendCommitMessageToRunName: false

### Only manual pipeline run ###
trigger:
  - none

### Schedule: Run every weekday at 09:00 UTC ###
schedules:
  - cron: "0 9 * * 1-5"
    displayName: Weekday Key Vault Secrets Check (09:00 UTC)
    branches:
      include:
        - main
    always: true

parameters:
  - name: targetEnv
    displayName: Target Environment (Manual Run Only)
    type: string
    default: dev
    values:
    - dev
    - qa
    - prod

  - name: daysThreshold
    displayName: Days Threshold (alert if expiring within X days)
    type: number
    default: 7

### Defining run variables ###
variables:
  - template: ../templates/variables-oboba.yml
    parameters:
      targetEnv: ${{ parameters.targetEnv }}

### Defining the name of the pipeline run ###
name: "[ Node03 KV Secrets Check ] [ $(Rev:r) ]"

### Defining stages of the pipeline ###
stages:
  - stage: checkKeyVaultSecrets
    displayName: Check Key Vault Secrets Expiration
    jobs:
      # ============== MANUAL RUN JOB ==============
      - ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
        - job: checkSecretsManual
          displayName: Scan Key Vaults for Expiring Secrets (Manual)
          pool:
            name: $(agentPool)
          steps:
            - checkout: none
            - template: ../templates/template-install-az-cli.yml
            - template: ../templates/template-check-kv-secrets-expiration.yml
              parameters:
                resourceGroupName: '$(resourceGroupName)'
                targetEnv: '$(targetEnv)'
                daysThreshold: ${{ parameters.daysThreshold }}
                azureSubscription: '$(azureSubscription)'
            - task: PublishPipelineArtifact@1
              displayName: 'Publish HTML Report as Artifact (Issues Found)'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))
              inputs:
                targetPath: '$(Build.ArtifactStagingDirectory)/reports'
                artifact: 'KeyVaultSecretsReport-$(targetEnv)'
                publishLocation: 'pipeline'
            - bash: echo "##vso[task.setvariable variable=artifactPublished;isOutput=true]true"
              name: setArtifactPublished
              displayName: 'Flag artifact as published'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))

      # ============== SCHEDULED RUN JOBS ==============
      # Matrix job for DEV & QA
      - ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
        - job: checkSecretsNonProd
          displayName: Scan Key Vaults - DEV & QA
          strategy:
            matrix:
              dev:
                agentPool: 'Oboba-Dev-AgentPool'
                resourceGroupName: 'RG-Oboba-Dev'
                targetEnv: 'dev'
                azureSubscription: 'NonProdServiceConnection'
              qa:
                agentPool: 'Oboba-QA-AgentPool'
                resourceGroupName: 'RG-Oboba-QA'
                targetEnv: 'qa'
                azureSubscription: 'NonProdServiceConnection'
          pool:
            name: $(agentPool)
          steps:
            - checkout: none
            - template: ../templates/template-install-az-cli.yml
            - template: ../templates/template-check-kv-secrets-expiration.yml
              parameters:
                resourceGroupName: '$(resourceGroupName)'
                targetEnv: '$(targetEnv)'
                daysThreshold: ${{ parameters.daysThreshold }}
                azureSubscription: '$(azureSubscription)'
            - task: PublishPipelineArtifact@1
              displayName: 'Publish HTML Report as Artifact (Issues Found)'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))
              inputs:
                targetPath: '$(Build.ArtifactStagingDirectory)/reports'
                artifact: 'KeyVaultSecretsReport-$(targetEnv)'
                publishLocation: 'pipeline'
            - bash: echo "##vso[task.setvariable variable=artifactPublished;isOutput=true]true"
              name: setArtifactPublished
              displayName: 'Flag artifact as published'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))

        # Separate job for PROD
        - job: checkSecretsProd
          displayName: Scan Key Vaults - PROD
          pool:
            name: 'Oboba-Prod-AgentPool'
          variables:
            targetEnv: prod
            resourceGroupName: 'RG-Oboba-Prod'
          steps:
            - checkout: none
            - template: ../templates/template-install-az-cli.yml
            - template: ../templates/template-check-kv-secrets-expiration.yml
              parameters:
                resourceGroupName: 'RG-Oboba-Prod'
                targetEnv: 'prod'
                daysThreshold: ${{ parameters.daysThreshold }}
                azureSubscription: 'ProdServiceConnection'
            - task: PublishPipelineArtifact@1
              displayName: 'Publish HTML Report as Artifact (Issues Found)'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))
              inputs:
                targetPath: '$(Build.ArtifactStagingDirectory)/reports'
                artifact: 'KeyVaultSecretsReport-prod'
                publishLocation: 'pipeline'

            - bash: echo "##vso[task.setvariable variable=artifactPublished;isOutput=true]true"
              name: setArtifactPublished
              displayName: 'Flag artifact as published'
              condition: or(gt(variables['checkExpiration.expiringSecretsCount'], 0), gt(variables['checkExpiration.noExpirySecretsCount'], 0))


  # ============== EMAIL NOTIFICATION STAGE ==============
  - stage: notifyTeamSendGrid
    displayName: Send Email Notification via SendGrid
    dependsOn: checkKeyVaultSecrets
    # Only run if any artifact was published
    condition: |
      or(
        eq(dependencies.checkKeyVaultSecrets.outputs['checkSecretsNonProd.dev.setArtifactPublished.artifactPublished'], 'true'),
        eq(dependencies.checkKeyVaultSecrets.outputs['checkSecretsNonProd.qa.setArtifactPublished.artifactPublished'], 'true'),
        eq(dependencies.checkKeyVaultSecrets.outputs['checkSecretsProd.setArtifactPublished.artifactPublished'], 'true'),
        eq(dependencies.checkKeyVaultSecrets.outputs['checkSecretsManual.setArtifactPublished.artifactPublished'], 'true')
      )
    jobs:
      # ============== MANUAL RUN EMAIL ==============
      - ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
        - template: ../templates/template-send-email-job.yml
          parameters:
            jobName: 'sendEmailManual'
            resourceGroupName: '$(resourceGroupName)'
            targetEnv: '$(targetEnv)'
            agentPool: '$(agentPool)'
            azureSubscription: '$(azureSubscription)'
            keyVaultName: '$(keyVaultNameAdm)'
            emailRecipient: "admin@example.com,security@example.com"
            condition: eq(stageDependencies.checkKeyVaultSecrets.checkSecretsManual.outputs['setArtifactPublished.artifactPublished'], 'true')

      # ============== SCHEDULED RUN EMAILS ==============
      - ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
        # Send email for DEV only if DEV artifact was published
        - template: ../templates/template-send-email-job.yml
          parameters:
            jobName: 'sendEmailDev'
            resourceGroupName: 'RG-Oboba-Dev'
            targetEnv: 'dev'
            agentPool: 'Oboba-Dev-AgentPool'
            azureSubscription: 'NonProdServiceConnection'
            keyVaultName: 'AKV-Oboba-DEV-ADM'
            emailRecipient: "admin@example.com,security@example.com"
            condition: eq(stageDependencies.checkKeyVaultSecrets.checkSecretsNonProd.outputs['dev.setArtifactPublished.artifactPublished'], 'true')

        # Send email for QA only if QA artifact was published
        - template: ../templates/template-send-email-job.yml
          parameters:
            jobName: 'sendEmailQA'
            resourceGroupName: 'RG-Oboba-QA'
            targetEnv: 'qa'
            agentPool: 'Oboba-QA-AgentPool'
            azureSubscription: 'NonProdServiceConnection'
            keyVaultName: 'AKV-Oboba-QA-ADM'
            emailRecipient: "admin@example.com,security@example.com"
            condition: eq(stageDependencies.checkKeyVaultSecrets.checkSecretsNonProd.outputs['qa.setArtifactPublished.artifactPublished'], 'true')

        # Send email for PROD only if PROD artifact was published
        - template: ../templates/template-send-email-job.yml
          parameters:
            jobName: 'sendEmailProd'
            resourceGroupName: 'RG-Oboba-Prod'
            targetEnv: 'prod'
            agentPool: 'Oboba-Prod-AgentPool'
            azureSubscription: 'ProdServiceConnection'
            keyVaultName: 'AKV-Oboba-PRD-ADM'
            emailRecipient: "admin@example.com,security@example.com,prod-support@example.com,platform-admin@example.com"
            condition: eq(stageDependencies.checkKeyVaultSecrets.checkSecretsProd.outputs['setArtifactPublished.artifactPublished'], 'true')
