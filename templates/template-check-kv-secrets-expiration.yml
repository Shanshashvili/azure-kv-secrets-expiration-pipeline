#############################################################################################
## Reusable Template: Key Vault Secrets Expiration Check
# Description:
#   Checks all Key Vaults in a resource group for expiring secrets and secrets without expiration dates.
#   Generates an HTML report and sets output variables for downstream tasks.
# Parameters:
#   - resourceGroupName: Resource group containing the Key Vaults (e.g., RG-Oboba-Dev)
#   - targetEnv: Target environment (dev/qa/prod)
#   - daysThreshold: Number of days to check for expiring secrets
#   - azureSubscription: Azure service connection name (e.g., NonProdServiceConnection)
# Outputs:
#   - hasExpiringSecrets: Boolean indicating if secrets are expiring
#   - expiringSecretsCount: Number of secrets expiring within threshold
#   - noExpirySecretsCount: Number of secrets without expiration date
#############################################################################################

parameters:
  - name: resourceGroupName
    type: string
  - name: targetEnv
    type: string
  - name: daysThreshold
    type: number
  - name: azureSubscription
    type: string

steps:
  - task: AzureCLI@2
    name: checkExpiration
    displayName: "Check Key Vault Secrets Expiration"
    inputs:
      azureSubscription: "${{ parameters.azureSubscription }}"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        set -euo pipefail

        echo "=========================================="
        echo "Key Vault Secrets Expiration Check"
        echo "=========================================="
        echo "Resource Group: ${{ parameters.resourceGroupName }}"
        echo "Environment: ${{ parameters.targetEnv }}"
        echo "Days Threshold: ${{ parameters.daysThreshold }} days"
        echo "Azure Subscription: ${{ parameters.azureSubscription }}"
        echo "Build Reason: $(Build.Reason)"
        echo "=========================================="
        echo ""

        # Get current date in epoch seconds
        currentDate=$(date +%s)
        thresholdDate=$((currentDate + (${{ parameters.daysThreshold }} * 86400)))

        # Create output directory
        outputDir="$(Build.ArtifactStagingDirectory)/reports"
        mkdir -p "$outputDir"
        reportFile="$outputDir/keyvault-secrets-expiration-report.html"

        # Initialize HTML report
        reportDate=$(date '+%Y-%m-%d %H:%M:%S UTC')
        cat > "$reportFile" << EOF
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Key Vault Secrets Expiration Report</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            h1 { color: #0078d4; }
            table { border-collapse: collapse; width: 100%; margin: 20px 0; }
            th { background-color: #0078d4; color: white; padding: 10px; text-align: left; }
            td { padding: 8px; border: 1px solid #ddd; }
            .expired { background-color: #ffcccc; color: red; }
            .expiring { background-color: #fff4cc; color: orange; }
            .no-expiry { background-color: #e6f2ff; color: #0078d4; }
          </style>
        </head>
        <body>
          <h1>Key Vault Secrets Expiration Report</h1>
          <p><strong>Report Date:</strong> ${reportDate}</p>
          <p><strong>Resource Group:</strong> ${{ parameters.resourceGroupName }}</p>
          <p><strong>Alert Threshold:</strong> ${{ parameters.daysThreshold }} days</p>
          <hr>
        EOF

        echo "Listing Key Vaults in resource group: ${{ parameters.resourceGroupName }}"

        # Get all Key Vaults in the resource group
        keyVaults=$(az keyvault list --resource-group "${{ parameters.resourceGroupName }}" --query "[].name" -o tsv)

        if [ -z "$keyVaults" ]; then
          echo "WARNING: No Key Vaults found in resource group ${{ parameters.resourceGroupName }}"
          cat >> "$reportFile" << 'EOF'
          <p style="color: orange;">⚠️ No Key Vaults found in the specified resource group.</p>
        </body>
        </html>
        EOF
          exit 0
        fi

        kvCount=$(echo "$keyVaults" | wc -l)
        echo "Found $kvCount Key Vault(s)"
        echo ""

        # Track statistics
        totalSecrets=0
        expiringSecrets=0
        noExpirySecrets=0

        hasExpiringSecrets=false
        hasNoExpirySecrets=false

        # Process each Key Vault
        for kvName in $keyVaults; do
          echo "Processing Key Vault: $kvName"

          # Get all secrets in the Key Vault
          secrets=$(az keyvault secret list --vault-name "$kvName" --query "[].{name:name,expires:attributes.expires,enabled:attributes.enabled}" -o json 2>/dev/null || echo "[]")

          secretCount=$(echo "$secrets" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "  Found $secretCount secret(s) in $kvName"
          totalSecrets=$((totalSecrets + secretCount))

          if [ "$secretCount" -eq 0 ]; then
            echo ""
            continue
          fi

          # Process secrets and find expiring ones and those without expiration
          processedSecrets=$(python3 << PYEOF
        import json
        import sys
        from datetime import datetime

        # Read from environment variable instead of stdin
        secrets_data = '''$secrets'''

        try:
            if not secrets_data or secrets_data.strip() == "[]":
                print(json.dumps({"expiring": [], "no_expiry": []}))
                sys.exit(0)
            secrets = json.loads(secrets_data)
        except Exception as e:
            print(json.dumps({"expiring": [], "no_expiry": []}))
            sys.exit(0)

        current_epoch = $currentDate
        threshold_epoch = $thresholdDate
        expiring = []
        no_expiry = []

        for secret in secrets:
            name = secret.get('name', 'Unknown')
            expires_str = secret.get('expires')
            enabled = secret.get('enabled', True)

            if not expires_str:
                # Collect secrets without expiration date
                no_expiry.append({
                    'name': name,
                    'enabled': enabled
                })
                continue

            # Parse expiration date
            try:
                expires_dt = datetime.fromisoformat(expires_str.replace('Z', '+00:00'))
                expires_epoch = int(expires_dt.timestamp())

                # Only include secrets that are expiring (not already expired)
                if current_epoch < expires_epoch <= threshold_epoch:
                    days_until = (expires_epoch - current_epoch) // 86400
                    expiring.append({
                        'name': name,
                        'expires': expires_str,
                        'days': days_until,
                        'enabled': enabled
                    })
            except Exception as e:
                pass
        print(json.dumps({"expiring": expiring, "no_expiry": no_expiry}))
        PYEOF
        )

          # Extract expiring and no-expiry secrets
          expiringInKv=$(echo "$processedSecrets" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('expiring', [])))" 2>/dev/null || echo "[]")
          noExpiryInKv=$(echo "$processedSecrets" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('no_expiry', [])))" 2>/dev/null || echo "[]")

          # Check if the output is valid before parsing
          if [ -z "$expiringInKv" ] || [ "$expiringInKv" = "[]" ]; then
            expiringCount=0
          else
            expiringCount=$(echo "$expiringInKv" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
          fi

          if [ -z "$noExpiryInKv" ] || [ "$noExpiryInKv" = "[]" ]; then
            noExpiryCount=0
          else
            noExpiryCount=$(echo "$noExpiryInKv" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
          fi

          # Only create Key Vault section if there are findings
          if [ "$expiringCount" -gt 0 ] || [ "$noExpiryCount" -gt 0 ]; then
            # Add Key Vault section to HTML
            cat >> "$reportFile" << EOF
          <h2>Key Vault: $kvName</h2>
        EOF
          fi

          if [ "$expiringCount" -gt 0 ]; then
            hasExpiringSecrets=true
            expiringSecrets=$((expiringSecrets + expiringCount))
            echo "  ⚠️  Found $expiringCount secret(s) expiring within ${{ parameters.daysThreshold }} days"

            # Add expiring secrets table
            cat >> "$reportFile" << EOF
          <h3>Secrets Expiring Within ${{ parameters.daysThreshold }} Days</h3>
          <table>
            <tr>
              <th>Key Vault</th>
              <th>Secret Name</th>
              <th>Expiration Date</th>
              <th>Days Until Expiration</th>
              <th>Enabled</th>
            </tr>
        EOF

            # Add each expiring secret to the table
            python3 << PYEOF >> "$reportFile"
        import json
        import sys

        kv_name = "$kvName"
        secrets_data = '''$expiringInKv'''

        try:
            if not secrets_data or secrets_data.strip() == "":
                sys.exit(0)
            secrets = json.loads(secrets_data)

            for secret in sorted(secrets, key=lambda x: x['days']):
                name = secret['name']
                expires = secret['expires'][:19]
                days = secret['days']
                enabled = "Yes" if secret['enabled'] else "No"

                if days == 0:
                    days_text = "Today"
                elif days == 1:
                    days_text = "1 day"
                else:
                    days_text = f"{days} days"

                print(f'  <tr class="expiring">')
                print(f'    <td>{kv_name}</td>')
                print(f'    <td>{name}</td>')
                print(f'    <td>{expires}</td>')
                print(f'    <td>{days_text}</td>')
                print(f'    <td>{enabled}</td>')
                print(f'  </tr>')
        except Exception as e:
            print(f'  <!-- Error processing secrets: {e} -->')
            sys.exit(0)
        PYEOF

            cat >> "$reportFile" << 'EOF'
          </table>
        EOF
          else
            echo "  ✓ No secrets expiring within ${{ parameters.daysThreshold }} days"
          fi

          # Handle secrets without expiration date
          if [ "$noExpiryCount" -gt 0 ]; then
            hasNoExpirySecrets=true
            noExpirySecrets=$((noExpirySecrets + noExpiryCount))
            echo "  ⚠️  Found $noExpiryCount secret(s) WITHOUT expiration date"

            # Add no-expiry secrets table
            cat >> "$reportFile" << EOF
          <h3 style="color: #0078d4;">⚠️ Secrets Without Expiration Date</h3>
          <p style="color: #d13438;"><strong>Warning:</strong> These secrets do not have an expiration date set. This is a security risk and should be addressed.</p>
          <table>
            <tr>
              <th>Key Vault</th>
              <th>Secret Name</th>
              <th>Status</th>
              <th>Enabled</th>
            </tr>
        EOF

            # Add each secret without expiration to the table
            python3 << PYEOF >> "$reportFile"
        import json
        import sys

        kv_name = "$kvName"
        no_expiry_data = '''$noExpiryInKv'''

        try:
            if not no_expiry_data or no_expiry_data.strip() == "":
                sys.exit(0)
            secrets = json.loads(no_expiry_data)

            for secret in sorted(secrets, key=lambda x: x['name']):
                name = secret['name']
                enabled = "Yes" if secret['enabled'] else "No"

                print(f'  <tr class="no-expiry">')
                print(f'    <td>{kv_name}</td>')
                print(f'    <td>{name}</td>')
                print(f'    <td>No Expiration Set</td>')
                print(f'    <td>{enabled}</td>')
                print(f'  </tr>')
        except Exception as e:
            print(f'  <!-- Error processing no-expiry secrets: {e} -->')
            sys.exit(0)
        PYEOF

            cat >> "$reportFile" << 'EOF'
          </table>
        EOF
          else
            echo "  ✓ All secrets have expiration dates set"
          fi

          echo ""
        done

        # Add summary statistics
        cat >> "$reportFile" << EOF
          <hr>
          <h2>Summary</h2>
          <p><strong>Total Key Vaults Scanned:</strong> $kvCount</p>
          <p><strong>Total Secrets Scanned:</strong> $totalSecrets</p>
          <p><strong>Secrets Expiring Within ${{ parameters.daysThreshold }} Days:</strong> $expiringSecrets</p>
          <p><strong>Secrets Without Expiration Date:</strong> $noExpirySecrets</p>
        EOF

        # Add status messages
        if [ "$hasExpiringSecrets" = false ] && [ "$hasNoExpirySecrets" = false ]; then
          cat >> "$reportFile" << 'EOF'
          <p style="color: green;">✅ No secrets are expiring within the specified threshold and all secrets have expiration dates set.</p>
        EOF
        elif [ "$hasExpiringSecrets" = false ] && [ "$hasNoExpirySecrets" = true ]; then
          cat >> "$reportFile" << 'EOF'
          <p style="color: orange;">⚠️ No secrets are expiring soon, but some secrets do not have expiration dates set.</p>
        EOF
        fi

        # Close HTML
        cat >> "$reportFile" << EOF
          <hr>
          <p style="font-size: 12px; color: gray;">Generated by Azure DevOps Pipeline | $(Build.DefinitionName) | Build #$(Build.BuildNumber)</p>
        </body>
        </html>
        EOF

        echo "=========================================="
        echo "Summary:"
        echo "  Key Vaults Scanned: $kvCount"
        echo "  Total Secrets: $totalSecrets"
        echo "  Expiring Within ${{ parameters.daysThreshold }} Days: $expiringSecrets"
        echo "  Without Expiration Date: $noExpirySecrets"
        echo "=========================================="
        echo ""
        echo "HTML report generated: $reportFile"

        # Set pipeline result based on findings
        if [ "$expiringSecrets" -gt 0 ] || [ "$noExpirySecrets" -gt 0 ]; then
          if [ "$expiringSecrets" -gt 0 ]; then
            echo "##vso[task.logissue type=warning]Found $expiringSecrets secret(s) expiring soon"
          fi
          if [ "$noExpirySecrets" -gt 0 ]; then
            echo "##vso[task.logissue type=warning]Found $noExpirySecrets secret(s) without expiration date"
          fi
          echo "##vso[task.complete result=SucceededWithIssues;]Secrets require attention"
          echo "##vso[task.setvariable variable=hasExpiringSecrets;isOutput=true]true"
          echo "##vso[task.setvariable variable=expiringSecretsCount;isOutput=true]$expiringSecrets"
          echo "##vso[task.setvariable variable=noExpirySecretsCount;isOutput=true]$noExpirySecrets"
        else
          echo "✅ All secrets are valid. No action required."
          echo "##vso[task.setvariable variable=hasExpiringSecrets;isOutput=true]false"
          echo "##vso[task.setvariable variable=expiringSecretsCount;isOutput=true]0"
          echo "##vso[task.setvariable variable=noExpirySecretsCount;isOutput=true]0"
        fi

        # Set HTML report as output variable for email body
        htmlBody=$(cat "$reportFile" | base64 | tr -d '\n')
        echo "##vso[task.setvariable variable=htmlBody;isOutput=true]$htmlBody"
